[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "face-mesh"
version = "1.3.0"
description = "Real-time face mesh with head pose, blink/gaze, drowsiness, multi-face tracking and export (MediaPipe + OpenCV)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Anastasija Temova" }]
keywords = ["mediapipe", "opencv", "face-mesh", "head-pose", "gaze", "drowsiness", "computer-vision"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "mediapipe>=0.10.30",
    "opencv-python>=4.8",
    "numpy>=1.24",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E741", "E702"]
"tests/conftest.py" = ["E741", "E702", "E402"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
pdf = ["weasyprint>=60"]
dev = ["pytest>=7", "matplotlib>=3.7", "reportlab>=4"]

[project.scripts]
facemesh = "facemesh.cli:main"

[project.urls]
Homepage = "https://github.com/ATemova/face-mesh"
Repository = "https://github.com/ATemova/face-mesh"

[tool.setuptools]
packages = ["facemesh", "facemesh.medical"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repo root on sys.path so `pytest` and `python -m pytest` behave the
# same. Without this, tests importing `scripts.*` fail under bare `pytest`.
pythonpath = ["."]
