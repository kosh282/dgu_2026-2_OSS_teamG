name: ci

on:
  push:
    branches: [main, medical]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pin ruff so local and CI never disagree on lint (past pain point).
          pip install "ruff==0.15.20" pytest
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Install the package itself if it declares a build (editable, no deps re-resolve).
          if [ -f pyproject.toml ]; then pip install -e . || pip install -e ".[dev]" || true; fi

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        # Headless: no camera, no display. Skip anything marked as needing hardware.
        env:
          MPLBACKEND: Agg
          FACEMESH_HEADLESS: "1"
        run: pytest -q
